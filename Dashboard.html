<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Dashboard</title>

<style>

body{
    margin:0;
    padding:0;
    font-family: Arial;
    background-image:url('https://images.unsplash.com/photo-1518770660439-4636190af475');
    background-size:cover;
    background-position:center;
    height:100vh;
    color:white;
}

.overlay{
    width:100%;
    height:100vh;
    background:rgba(0,0,0,0.6);
    padding-top:80px;
}

.search-box{
    width:100%;
    text-align:center;
    margin-bottom:40px;
}

.search-box input{
    width:350px;
    padding:15px;
    font-size:20px;
    border:none;
    outline:none;
}

.search-box button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    background:#ff4d4d;
    color:white;
    cursor:pointer;
}

.search-box button:hover{
    background:red;
}

table{
    width:90%;
    margin:auto;
    border-collapse:collapse;
    background:rgba(0,0,0,0.5);
}

th{
    color:red;
    font-size:18px;
    padding:15px;
    border:1px solid white;
}

td{
    color:white;
    padding:12px;
    border:1px solid white;
    text-align:center;
}

.logout{
    position:absolute;
    top:20px;
    right:30px;
}

.logout button{
    padding:10px 20px;
    border:none;
    background:#ff4d4d;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.logout button:hover{
    background:red;
}

</style>
</head>

<body>

<div class="overlay">

<div class="logout">
<button onclick="logout()">Logout</button>
</div>

<div class="search-box">

<input type="text" id="searchInput" placeholder="Search number, name, email">

<button onclick="searchData()">Search</button>

</div>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Father Name</th>
<th>Mobile No.</th>
<th>Alternate No.</th>
<th>Local Address</th>
<th>Email</th>
<th>EID</th>
</tr>
</thead>

<tbody id="resultBody">

</tbody>

</table>

</div>

<script>

async function searchData() {

    const q = document.getElementById("searchInput").value.trim();

    if (!q) {
        alert("Enter Number, Name or Email");
        return;
    }

    const tbody = document.getElementById("resultBody");

    tbody.innerHTML = `
        <tr>
            <td colspan="8">Searching...</td>
        </tr>
    `;

    try {

        const response = await fetch(`http://localhost:5000/search?q=${q}`);

        const data = await response.json();

        tbody.innerHTML = "";

        if (data.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="8">No Data Found</td>
                </tr>
            `;

            return;
        }

        data.forEach((item, index) => {

            tbody.innerHTML += `
            
            <tr>
                <td>${index + 1}</td>
                <td>${item.name || ""}</td>
                <td>${item.fname || ""}</td>
                <td>${item.mobile || ""}</td>
                <td>${item.alt || ""}</td>
                <td>${item.address || ""}</td>
                <td>${item.email || ""}</td>
                <td>${item.id || ""}</td>
            </tr>

            `;

        });

    } catch (error) {

        console.log(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="8">Server Error</td>
            </tr>
        `;
    }

}

function logout(){

    window.location.href = "index.html";

}

</script>

</body>
</html>
