<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Cyber Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:url("https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      min-height:100vh;
      padding:40px;
      color:white;
    }

    .top-bar{
      width:100%;
      display:flex;
      justify-content:flex-end;
      margin-bottom:30px;
    }

    .logout-btn{
      padding:12px 25px;
      background:#ff3b3b;
      border:none;
      color:white;
      font-size:18px;
      cursor:pointer;
      border-radius:5px;
    }

    .search-box{
      width:100%;
      display:flex;
      justify-content:center;
      margin-bottom:40px;
    }

    .search-box input{
      width:400px;
      padding:18px;
      border:none;
      outline:none;
      font-size:22px;
      background:white;
      color:black;
    }

    .search-box button{
      padding:18px 35px;
      border:none;
      background:#ff3b3b;
      color:white;
      font-size:22px;
      cursor:pointer;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:rgba(0,0,0,0.6);
      backdrop-filter:blur(4px);
    }

    th{
      color:red;
      padding:18px;
      border:1px solid white;
      font-size:28px;
    }

    td{
      padding:16px;
      border:1px solid white;
      text-align:center;
      font-size:20px;
      color:white;
    }

    tr:hover{
      background:rgba(255,255,255,0.1);
    }

    @media(max-width:900px){

      .search-box{
        flex-direction:column;
        align-items:center;
      }

      .search-box input{
        width:90%;
      }

      .search-box button{
        width:90%;
        margin-top:10px;
      }

      table{
        font-size:12px;
      }

    }

  </style>

</head>

<body>

  <div class="top-bar">
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="search-box">

    <input
      type="text"
      id="search"
      placeholder="Search number, name, email"
    />

    <button onclick="searchData()">
      Search
    </button>

  </div>

  <table>

    <thead>

      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Father Name</th>
        <th>Mobile No.</th>
        <th>Alternate No.</th>
        <th>Local Address</th>
        <th>Email</th>
        <th>EID</th>
      </tr>

    </thead>

    <tbody id="result">

    </tbody>

  </table>

  <script>

    async function searchData() {

      const query = document.getElementById("search").value;

      if (!query) {

        alert("Enter number or name");
        return;

      }

      try {

        const response = await fetch(
          `https://cyber-dashboard-y7u8.onrender.com/search?q=${query}`
        );

        const data = await response.json();

        let output = "";

        if (data.length === 0) {

          output = `
            <tr>
              <td colspan="8">No Data Found</td>
            </tr>
          `;

        } else {

          data.forEach((user, index) => {

            output += `
              <tr>
                <td>${index + 1}</td>
                <td>${user.name || ""}</td>
                <td>${user.fname || ""}</td>
                <td>${user.mobile || ""}</td>
                <td>${user.alt || ""}</td>
                <td>${user.address || ""}</td>
                <td>${user.email || ""}</td>
                <td>${user.id || ""}</td>
              </tr>
            `;

          });

        }

        document.getElementById("result").innerHTML = output;

      } catch (error) {

        console.log(error);

        document.getElementById("result").innerHTML = `
          <tr>
            <td colspan="8">Server Error</td>
          </tr>
        `;

      }

    }

    function logout(){

      window.location.href = "Index.html";

    }

  </script>

</body>
</html>
